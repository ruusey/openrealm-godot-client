# Local OpenRealm stack: MongoDB, the data service and the game server.
#
# Everything runs in containers so the host needs no Java, Maven or MongoDB.
# The Dockerfiles are inline because the build context has to be the parent
# directory holding both `openrealm/` and `openrealm-data/` -- they are
# separate private repos cloned beside champion-spawn -- and this keeps those
# repos untouched.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Note: the game server's own Dockerfile copies `openrealm-0.6.0-shaded.jar`
# and the README calls it `openrealm-shaded.jar`; the build actually produces
# `openrealm-<pom version>-shaded.jar`, so neither works as written. This
# resolves it by glob instead, which is why it survived 0.7.0 -> 0.9.0.

name: openrealm

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  data:
    build:
      # Each repo is its own context, rather than one context over the parent
      # directory -- the parent is a general-purpose checkout folder and would
      # be uploaded to the daemon in full.
      context: ../../../openrealm
      additional_contexts:
        data-repo: ../../../openrealm-data
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-17 AS build
        WORKDIR /app
        # openrealm-data depends on the game-server artifact, so install it first.
        COPY . ./openrealm
        RUN mvn -B -q clean install -DskipTests -f ./openrealm/pom.xml
        COPY --from=data-repo . ./openrealm-data
        RUN mvn -B -q clean package -DskipTests -f ./openrealm-data/pom.xml

        FROM eclipse-temurin:17-jre
        COPY --from=build /app/openrealm-data/target/openrealm-data.jar /openrealm-data.jar
        # The service writes into its content dir (.backups, editor saves), so
        # the repo content is baked in rather than bind-mounted -- a read-only
        # mount makes it fail at startup, and a writable one would dirty the
        # checkout.
        COPY --from=data-repo src/main/resources/data /content/data
        COPY --from=data-repo src/main/resources/entity /content/entity
        ENTRYPOINT ["java", "-jar", "/openrealm-data.jar"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo
      DATA_PORT: "80"
      # The game server calls /data/account/{guid} with no Authorization
      # header and relies on being a trusted host. In the deployed setup the
      # two services share a host so that is loopback; in containers they do
      # not, so the game service name has to be trusted explicitly or every
      # login fails with 401.
      TRUSTED_HOSTS: game
      # Content comes from the repo, copied into the image at build time, so
      # the client and the server read the same game data.
      OPENREALM_DATA_DIR: /content/data
      OPENREALM_SPRITES_DIR: /content/entity
    ports:
      - "8080:80"

  game:
    build:
      context: ../../../openrealm
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-17 AS build
        WORKDIR /app
        COPY . .
        # The shade plugin emits openrealm-<version>-shaded.jar, so resolve it
        # by glob rather than pinning a version that goes stale.
        RUN mvn -B -q clean package -DskipTests \
         && cp target/openrealm-*-shaded.jar /openrealm.jar

        FROM eclipse-temurin:17-jre
        COPY --from=build /openrealm.jar /openrealm.jar
        ENTRYPOINT ["sh", "-c", "java -jar /openrealm.jar $$DATA_SERVER_ADDR"]
    restart: unless-stopped
    depends_on:
      - data
    environment:
      DATA_SERVER_ADDR: data
    ports:
      - "2222:2222"   # native TCP client
      - "2223:2223"   # websocket client

volumes:
  mongo-data:
