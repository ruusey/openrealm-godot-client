name: Release builds

# Exports the Godot client for Web + desktop (Windows / Linux) and publishes
# them as GitHub Release assets. Mirrors the native client's tag-driven release:
# push a v* tag to cut a release.
#
#   openrealm-godot-web.zip     -> deploy-remote.bat pulls this to the /play mount
#   openrealm-godot-windows.zip -> single OpenRealm.exe (pck embedded)
#   openrealm-godot-linux.zip   -> single OpenRealm.x86_64 (pck embedded)
#
# macOS is intentionally not built (unsigned .app is a poor experience and needs
# an Apple cert + notarization we don't have).
#
# Exports run with the standard (non-Mono) Godot 4.7.2 headless binary -- the
# Mono build refuses web exports (see export_presets.cfg). The Web preset has
# thread support off so the page needs no COOP/COEP headers.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-builds
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  PROJECT_DIR: .
  WEB_ASSET: openrealm-godot-web.zip
  WIN_ASSET: openrealm-godot-windows.zip
  LINUX_ASSET: openrealm-godot-linux.zip

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          # Bumped from the web-only key: desktop exports need the full template set.
          key: godot-${{ env.GODOT_VERSION }}-all-templates-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} + all export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"

          fetch() {
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 \
              --speed-limit 100000 --speed-time 30 --max-time 900 -o "$2" "$1"
          }

          echo "== editor binary"
          mkdir -p ~/godot
          fetch "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          rm -f /tmp/godot.zip

          # The templates archive (.tpz) is a zip covering every platform (~1 GB
          # unpacked). We now export desktop targets too, so extract the whole
          # set into the version dir Godot looks in rather than cherry-picking web.
          echo "== export templates (all platforms)"
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL_DIR"
          fetch "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" /tmp/templates.tpz
          unzip -oq /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TPL_DIR"/
          rm -rf /tmp/templates.tpz /tmp/tpl
          ls -la "$TPL_DIR"

      - name: Godot version
        run: ~/godot/godot --headless --version

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # The auto-updater reads application/config/version and compares it to
          # the latest release tag, so bake the tag in before exporting.
          sed -i "s|^config/version=.*|config/version=\"$VER\"|" project.godot
          grep '^config/version=' project.godot

      - name: Import project
        run: ~/godot/godot --headless --path "$PROJECT_DIR" --import

      - name: Export all targets
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/web build/windows build/linux

          # export-release can exit non-zero on non-fatal warnings, so verify the
          # artifact exists rather than trusting the exit code.
          export_target() {
            local preset="$1" out="$2" must="$3"
            echo "== export $preset -> $out"
            ~/godot/godot --headless --path "$PROJECT_DIR" --export-release "$preset" "$out" || true
            test -f "$must" || { echo "export '$preset' produced no $must" >&2; exit 1; }
          }

          export_target "Web"             build/web/index.html    "build/web/index.wasm"
          export_target "Windows Desktop" build/windows/OpenRealm.exe "build/windows/OpenRealm.exe"
          export_target "Linux"           build/linux/OpenRealm.x86_64 "build/linux/OpenRealm.x86_64"

          chmod +x build/linux/OpenRealm.x86_64
          ls -la build/web build/windows build/linux

      # Build a clean BMP-based multi-size .ico from the source PNG for the Windows
      # .exe icon. The actual embedding happens natively in the brand-windows job
      # (rcedit under wine on this Linux runner silently no-ops); imagemagick here
      # just produces the .ico, which is passed along in the build artifact.
      - name: Build Windows .ico from icon.png
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          convert icon.png -background none -define icon:auto-resize=256,128,64,48,32,16 openrealm.ico
          ls -la openrealm.ico

      - name: Package release zips
        run: |
          set -euo pipefail
          # index.html at the zip root so it unpacks straight into the /play mount.
          (cd build/web && zip -r "$GITHUB_WORKSPACE/$WEB_ASSET" .)
          (cd build/windows && zip "$GITHUB_WORKSPACE/$WIN_ASSET" OpenRealm.exe)
          (cd build/linux && zip "$GITHUB_WORKSPACE/$LINUX_ASSET" OpenRealm.x86_64)
          ls -la "$WEB_ASSET" "$WIN_ASSET" "$LINUX_ASSET"

      - name: Upload zips as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openrealm-godot-builds
          path: |
            ${{ env.WEB_ASSET }}
            ${{ env.WIN_ASSET }}
            ${{ env.LINUX_ASSET }}
            openrealm.ico
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.WEB_ASSET }}
            ${{ env.WIN_ASSET }}
            ${{ env.LINUX_ASSET }}
          generate_release_notes: true
          draft: false
          prerelease: false
          # Keep releases/latest/download/*.zip pointing here regardless of
          # tag-push ordering -- deploy-remote.bat pulls the web zip from there.
          make_latest: 'true'

  # Embed the .exe icon on a NATIVE Windows runner. rcedit is a Windows binary;
  # running it under wine on the Linux release job silently no-ops, so the .exe
  # kept shipping the default Godot icon. Here it runs natively, then overwrites
  # the windows zip asset on the same release. Separate job so a hiccup never
  # blocks the web/linux release.
  brand-windows:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openrealm-godot-builds

      - name: Brand .exe icon (native rcedit) and repackage
        shell: pwsh
        run: |
          Expand-Archive -Force "$env:WIN_ASSET" winout
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" `
            -OutFile rcedit.exe
          .\rcedit.exe "winout\OpenRealm.exe" --set-icon openrealm.ico
          if ($LASTEXITCODE -ne 0) { throw "rcedit failed with exit $LASTEXITCODE" }
          Remove-Item "$env:WIN_ASSET"
          Compress-Archive -Path "winout\OpenRealm.exe" -DestinationPath "$env:WIN_ASSET" -Force

      - name: Re-upload branded windows zip to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.WIN_ASSET }}
