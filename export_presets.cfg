; Export presets.
;
; Web is the target served at openrealm.net/play. The desktop presets
; (Windows / Linux / macOS) are built by CI on a v* tag and published as release
; zips for players to download; the in-app updater pulls newer ones from the
; releases page. The macOS .app is UNSIGNED (no Apple cert in CI) -- Gatekeeper
; flags it on first launch; users right-click -> Open. The mac build is x86_64
; (runs on Apple Silicon via Rosetta 2); universal/arm64 needs ETC2 ASTC import.
;
; NOTE: this cannot be exported with the Mono editor. Godot 4 refuses a web
; export from a C#/.NET build even when the project has no C# in it, and says
; so: "use a non-C# editor build to export the project". Use the standard
; Godot 4.7.2, which is also what CI uses.
;
; thread_support is off on the Web preset on purpose. Threaded web builds
; require the page to be cross-origin isolated (COOP/COEP headers), which rules
; out most static hosting; nothing here uses threads, so the no-threads template
; avoids the whole problem.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.bin"
exclude_filter="tests/*, reports/*, docs/*, tools/*, addons/gut/*, *.md, *.sh"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.bin"
exclude_filter="tests/*, reports/*, docs/*, tools/*, addons/gut/*, *.md, *.sh"
export_path="build/windows/OpenRealm.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
; Godot's own resource edit needs rcedit wired into the editor; left off so the
; export stays clean. CI instead brands the .exe icon after export with rcedit
; under wine (see release.yml "Brand Windows .exe icon"); icon.ico is the source.
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="OpenRealm"
application/product_name="OpenRealm"
application/file_description="OpenRealm"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=false
ssh_remote_deploy/enabled=false

[preset.2]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.bin"
exclude_filter="tests/*, reports/*, docs/*, tools/*, addons/gut/*, *.md, *.sh"
export_path="build/linux/OpenRealm.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
ssh_remote_deploy/enabled=false

[preset.3]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.bin"
exclude_filter="tests/*, reports/*, docs/*, tools/*, addons/gut/*, *.md, *.sh"
export_path="build/macos/OpenRealm.zip"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.3.options]

export/distribution_type=0
# x86_64, not universal/arm64: those require ETC2 ASTC texture import, which this
# project doesn't use (all textures are lossless, compress/mode=0) and the gate
# aborts the headless export. x86_64 only needs s3tc_bptc (on by default), so it
# exports cleanly on the Linux runner; Apple Silicon Macs run it under Rosetta 2.
binary_format/architecture="x86_64"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
application/icon="res://icon.png"
application/icon_interpolation=4
application/bundle_identifier="net.openrealm.client"
application/signature=""
application/app_category="Games"
application/short_version=""
application/version=""
application/copyright="OpenRealm"
application/min_macos_version_x86_64="10.12"
application/min_macos_version_arm64="11.00"
display/high_res=true
; CI has no Apple Developer certificate, so the .app ships UNSIGNED: codesign +
; notarization disabled. Gatekeeper flags it on first launch; users open it via
; right-click -> Open (or `xattr -dr com.apple.quarantine OpenRealm.app`).
codesign/codesign=0
codesign/entitlements/allow_jit_code_execution=false
codesign/entitlements/allow_unsigned_executable_memory=false
codesign/entitlements/allow_dyld_environment_variables=false
codesign/entitlements/disable_library_validation=false
codesign/custom_options=PackedStringArray()
notarization/notarization=0
ssh_remote_deploy/enabled=false
